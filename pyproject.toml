[project]
name = "twipsybot"
version = "0.14.0"
description = "AI-powered Misskey bot with OpenAI-compatible LLMs."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "OREEkE" }]
requires-python = ">=3.11"

dependencies = [
    "aiohttp==3.14.3",
    "aiosqlite==0.22.1",
    "apscheduler==3.11.3",
    "beautifulsoup4==4.15.0",
    "cachetools==7.1.7",
    "click==8.5.0",
    "durationpy==0.11",
    "feedparser==6.0.14",
    "loguru==0.7.3",
    "openai==3.24.0",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.3",
    "textual==8.2.8",
    "tiktoken==0.14.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.12.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[project.scripts]
twipsybot = "twipsybot.app.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["twipsybot", "plugins", "tests"]
exclude = ["data", "logs"]
reportUnsupportedDunderAll = "none"
reportAttributeAccessIssue = "error"
