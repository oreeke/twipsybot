[project]
name = "twipsybot"
version = "0.4.0"
description = "AI-powered Misskey bot with OpenAI-compatible LLMs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

dependencies = [
    "aiohttp==3.14.3",
    "aiosqlite==0.22.1",
    "apscheduler==3.11.3",
    "beautifulsoup4==4.15.0",
    "cachetools==7.1.7",
    "certifi==2026.7.22",
    "click==8.5.0",
    "durationpy==0.11",
    "feedparser==6.0.14",
    "loguru==0.7.3",
    "openai==3.6.0",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.3",
    "tenacity==9.1.4",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.12.0",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
twipsybot = "twipsybot.app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["twipsybot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["twipsybot", "plugins", "tests"]
exclude = ["data", "logs"]
reportUnsupportedDunderAll = "none"
reportAttributeAccessIssue = "error"
executionEnvironments = [
    { root = "plugins", reportAttributeAccessIssue = "none" },
    { root = "twipsybot/clients/misskey", reportAttributeAccessIssue = "none" },
]
